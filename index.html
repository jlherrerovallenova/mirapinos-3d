<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Finca Mirapinos, Simancas: 35 chalets unifamiliares con parcelas individuales. Explora la urbanización en 3D, consulta la disponibilidad, planos y soleamiento.">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Finca Mirapinos · Urbanización 3D Interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F4F4F0; --sheet:#FFFFFF; --ink:#1A2124; --ink-2:#4A5558; --ink-3:#7A8689; --rule:#D6DBD7;
  --pine:#1B4931; --pine-soft:#D5E8DD; --oak:#B07D48; --oak-soft:#EEDCC9;
  --free:#279655; --free-soft:#D5F2E1; --reserved:#E5A93C; --reserved-soft:#FDF2DD; --taken:#889498; --taken-soft:#E5E8E9;
  --display:"Archivo","Arial Narrow",sans-serif; --body:"Instrument Sans",sans-serif; --mono:"IBM Plex Mono",monospace;
  --panel-w:430px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121816; --sheet:#18201E; --ink:#EAF0EC; --ink-2:#A4B2AB; --ink-3:#6B7972; --rule:#293530;
    --pine:#2D7D55; --pine-soft:#163524; --free:#46BF7C; --free-soft:#173825; --reserved:#F2B248; --reserved-soft:#3A2C12; --taken:#687570;
    color-scheme:dark;
  }
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w)}
@media (max-width:960px){.app{grid-template-columns:1fr;grid-template-rows:55vh 45vh}}

/* Stage */
.stage{position:relative;min-width:0;overflow:hidden;background:linear-gradient(180deg,#7CA6D8 0%,#D3E5F5 65%,#E3EEE2 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));color:#fff;text-shadow:0 1px 12px rgba(10,30,20,.6);pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.8vw,32px);letter-spacing:.02em;line-height:1}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.95}

/* Badges / Counters */
.tally{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:18px;display:flex;align-items:center;gap:12px;background:rgba(20,32,27,.85);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-size:12px;border:1px solid rgba(255,255,255,.15);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.tally b{font-family:var(--display);font-size:18px;font-weight:700}
.tally .dot{width:10px;height:10px;border-radius:50%;background:#38DF7B;box-shadow:0 0 0 3px rgba(56,223,123,.3)}

/* Quick navigation tools in stage */
.controls-overlay{position:absolute;right:18px;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn-tool{background:rgba(20,32,27,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.btn-tool:hover{background:rgba(30,48,40,.95);transform:translateY(-1px)}

/* Legend */
.legend{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;background:rgba(20,32,27,.85);backdrop-filter:blur(8px);color:#fff;border-radius:8px;padding:8px 12px;font-size:11.5px;border:1px solid rgba(255,255,255,.15)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.c-free{background:var(--free)}
.c-res{background:var(--reserved)}
.c-sold{background:var(--taken)}

/* Tags in 3D Space */
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;border:0;background:#1B4931;color:#fff;border-radius:6px;padding:3px 7px;font:600 11px/1.2 var(--body);white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.3);transform-origin:50% 100%;transition:transform .12s,background .12s}
.tag::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:#1B4931}
.tag:hover,.tag.sel{background:#B07D48;transform:scale(1.12)}
.tag:hover::after,.tag.sel::after{border-top-color:#B07D48}

/* Sidebar Panel */
.panel{background:var(--sheet);border-left:1px solid var(--rule);display:flex;flex-direction:column;height:100%;overflow-y:auto;overflow-x:hidden}
.panel-head{padding:20px;border-bottom:1px solid var(--rule)}
.panel-head h2{margin:0 0 4px;font-family:var(--display);font-size:22px;font-weight:700}
.panel-head .desc{color:var(--ink-2);font-size:12.5px;margin:0}

/* Filters */
.filters{padding:14px 20px;border-bottom:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap;background:var(--paper)}
.filter-btn{border:1px solid var(--rule);background:var(--sheet);padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.filter-btn.active{background:var(--pine);color:#fff;border-color:var(--pine)}

/* Unit Detail View */
.unit-view{padding:20px;display:flex;flex-direction:column;gap:18px}
.unit-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:600}
.badge-LIBRE{background:var(--free-soft);color:var(--free)}
.badge-RESERVADA{background:var(--reserved-soft);color:#A86B10}
.badge-VENDIDA{background:var(--taken-soft);color:var(--taken)}

.unit-title{display:flex;justify-content:space-between;align-items:baseline}
.unit-title h3{margin:0;font-family:var(--display);font-size:24px}
.unit-price{font-family:var(--display);font-size:22px;font-weight:700;color:var(--pine)}

.specs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.spec-box{background:var(--paper);padding:10px 12px;border-radius:8px;border:1px solid var(--rule)}
.spec-label{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.spec-val{font-size:14px;font-weight:600;margin-top:2px}

.model-info{background:rgba(176,125,72,.08);border:1px solid rgba(176,125,72,.3);border-radius:8px;padding:12px}
.model-info h4{margin:0 0 6px;color:var(--oak);font-size:13px}
.model-info p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.4}

.action-cta{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn-primary{background:var(--pine);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;text-decoration:none;transition:background .15s}
.btn-primary:hover{background:#133825}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--rule);padding:10px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;text-align:center}
.btn-secondary:hover{background:var(--paper)}

/* Mortgage calculator pill */
.calc-box{background:var(--paper);border-radius:8px;padding:12px;border:1px solid var(--rule);font-size:12px}
.calc-title{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.calc-res{font-size:16px;font-weight:700;color:var(--pine);margin-top:4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div class="app">
  <!-- Stage 3D -->
  <div class="stage">
    <canvas id="gl"></canvas>
    <div class="brand">
      <h1>FINCA MIRAPINOS</h1>
      <p>35 CHALETS INDIVIDUALES · SIMANCAS (VALLADOLID)</p>
    </div>

    <div class="tally" id="tally">
      <span class="dot"></span>
      <span><b id="free-count">--</b> Disponibles</span>
    </div>

    <div class="controls-overlay">
      <button class="btn-tool" id="btn-sun-toggle">☀️ Simulación Solar</button>
      <button class="btn-tool" id="btn-reset-cam">🔄 Vista General</button>
    </div>

    <div class="legend">
      <span><i class="c-free"></i> Disponible</span>
      <span><i class="c-res"></i> Reservada</span>
      <span><i class="c-sold"></i> Vendida</span>
    </div>

    <div class="tags" id="tags"></div>
  </div>

  <!-- Panel Lateral -->
  <aside class="panel">
    <div class="panel-head">
      <h2>Finca Mirapinos</h2>
      <p class="desc">Viviendas unifamiliares de diseño en parcelas desde 433 m² junto al pinar de Simancas.</p>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="TODAS">Todas (35)</button>
      <button class="filter-btn" data-filter="LIBRE">Disponibles</button>
      <button class="filter-btn" data-filter="Olivo">Modelo Olivo</button>
      <button class="filter-btn" data-filter="Arce">Modelo Arce</button>
    </div>

    <div id="unit-content">
      <!-- Se llena dinámicamente con la vivienda seleccionada -->
    </div>
  </aside>
</div>

<script>
let D = null;
let scene, camera, renderer, controls;
let unitMeshes = [];
let selectedUnit = null;

async function init() {
  const res = await fetch('data.json');
  D = await res.json();

  document.getElementById('free-count').textContent = D.units.filter(u => u.estado === 'LIBRE').length;

  setupThree();
  buildEnvironment();
  buildChaletMeshes();
  renderUnitDetail(D.units[0]);

  setupEvents();
  animate();
}

function setupThree() {
  const canvas = document.getElementById('gl');
  const stage = canvas.parentElement;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdcebf7);
  scene.fog = new THREE.FogExp2(0xdcebf7, 0.0035);

  camera = new THREE.PerspectiveCamera(40, stage.clientWidth / stage.clientHeight, 1, 1000);
  camera.position.set(0, 110, 150);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI * 0.46;
  controls.minDistance = 15;
  controls.maxDistance = 300;
  controls.target.set(0, 0, 0);

  // Iluminación
  const hemi = new THREE.HemisphereLight(0xffffff, 0x5a6e5a, 0.65);
  scene.add(hemi);

  const amb = new THREE.AmbientLight(0xffffff, 0.25);
  scene.add(amb);

  const sun = new THREE.DirectionalLight(0xfff8ee, 1.8);
  sun.position.set(60, 120, 80);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -110;
  sun.shadow.camera.right = 110;
  sun.shadow.camera.top = 110;
  sun.shadow.camera.bottom = -110;
  sun.shadow.camera.near = 10;
  sun.shadow.camera.far = 300;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
}

function buildEnvironment() {
  // Terreno base
  const groundGeo = new THREE.PlaneGeometry(600, 600);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x7E9A68, roughness: 0.95 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Suelo interior urbanización
  const urbaGeo = new THREE.CircleGeometry(125, 48);
  const urbaMat = new THREE.MeshStandardMaterial({ color: 0x8DAE75, roughness: 0.9 });
  const urba = new THREE.Mesh(urbaGeo, urbaMat);
  urba.rotation.x = -Math.PI / 2;
  urba.position.y = 0.02;
  urba.receiveShadow = true;
  scene.add(urba);

  // Viales y líneas urbanísticas del DXF
  if (D.urbanizacion_lines) {
    const lineMatCalzada = new THREE.LineBasicMaterial({ color: 0x485257, linewidth: 2 });
    const lineMatBordillo = new THREE.LineBasicMaterial({ color: 0xE2DFD8 });
    const lineMatParque = new THREE.LineBasicMaterial({ color: 0x2A7045 });

    D.urbanizacion_lines.forEach(item => {
      const pts = item.pts.map(p => new THREE.Vector3(p[0], 0.06, -p[1]));
      if (item.closed && pts.length > 2) pts.push(pts[0]);
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      let mat = lineMatBordillo;
      if (item.layer.includes('CALZADA')) mat = lineMatCalzada;
      if (item.layer.includes('PARQUE') || item.layer.includes('CESPED')) mat = lineMatParque;
      const line = new THREE.Line(geo, mat);
      scene.add(line);
    });
  }
}

function buildChaletMeshes() {
  const matLibre = new THREE.MeshStandardMaterial({ color: 0x279655, roughness: 0.4, emissive: 0x0c3b1e, emissiveIntensity: 0.2 });
  const matRes = new THREE.MeshStandardMaterial({ color: 0xE5A93C, roughness: 0.5, emissive: 0x5a3b05, emissiveIntensity: 0.2 });
  const matVendida = new THREE.MeshStandardMaterial({ color: 0x889498, roughness: 0.8 });
  const matFachada = new THREE.MeshStandardMaterial({ color: 0xF2EFE9, roughness: 0.6 });
  const matTejado = new THREE.MeshStandardMaterial({ color: 0x3D4246, roughness: 0.7 });
  const matMadera = new THREE.MeshStandardMaterial({ color: 0xB07D48, roughness: 0.7 });

  D.units.forEach(unit => {
    const group = new THREE.Group();
    group.position.set(unit.x, 0, -unit.y);
    group.rotation.y = (unit.rot * Math.PI) / 180;
    group.userData = unit;

    // Base de parcela (pedestal interactivo)
    const pGeo = new THREE.BoxGeometry(unit.ancho + 4, 0.25, unit.fondo + 4);
    let pMat = matLibre;
    if (unit.estado === 'RESERVADA') pMat = matRes;
    if (unit.estado === 'VENDIDA') pMat = matVendida;
    const pMesh = new THREE.Mesh(pGeo, pMat);
    pMesh.position.y = 0.125;
    pMesh.receiveShadow = true;
    group.add(pMesh);

    // Volumen del Chalet: Planta Baja
    const pbGeo = new THREE.BoxGeometry(unit.ancho, 3.2, unit.fondo);
    const pbMesh = new THREE.Mesh(pbGeo, matFachada);
    pbMesh.position.y = 1.6 + 0.25;
    pbMesh.castShadow = true;
    pbMesh.receiveShadow = true;
    group.add(pbMesh);

    // Planta Primera (retranqueada con terraza)
    const ppAncho = unit.ancho * 0.8;
    const ppFondo = unit.fondo * 0.75;
    const ppGeo = new THREE.BoxGeometry(ppAncho, 2.9, ppFondo);
    const ppMesh = new THREE.Mesh(ppGeo, unit.tipologia.includes('Olivo') ? matMadera : matFachada);
    ppMesh.position.set(0, 3.2 + 1.45 + 0.25, 0.5);
    ppMesh.castShadow = true;
    ppMesh.receiveShadow = true;
    group.add(ppMesh);

    // Cubierta plana / peto
    const roofGeo = new THREE.BoxGeometry(ppAncho + 0.4, 0.3, ppFondo + 0.4);
    const roofMesh = new THREE.Mesh(roofGeo, matTejado);
    roofMesh.position.set(0, 3.2 + 2.9 + 0.15 + 0.25, 0.5);
    roofMesh.castShadow = true;
    group.add(roofMesh);

    scene.add(group);
    unitMeshes.push(group);
  });

  updateTags();
}

function updateTags() {
  const container = document.getElementById('tags');
  container.innerHTML = '';

  D.units.forEach(unit => {
    const el = document.createElement('button');
    el.className = 'tag';
    el.id = `tag-${unit.id}`;
    el.textContent = `${unit.numero}`;
    el.title = `${unit.nombre} (${unit.tipologia})`;
    el.onclick = () => selectUnit(unit);
    container.appendChild(el);
  });
}

function selectUnit(unit) {
  selectedUnit = unit;
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('sel'));
  const activeTag = document.getElementById(`tag-${unit.id}`);
  if (activeTag) activeTag.classList.add('sel');

  renderUnitDetail(unit);

  // Animación suave de cámara hacia la vivienda
  const targetPos = new THREE.Vector3(unit.x, 0, -unit.y);
  controls.target.lerp(targetPos, 0.5);
}

function renderUnitDetail(unit) {
  const container = document.getElementById('unit-content');
  const formattedPrice = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(unit.precio);

  // Cuota hipotecaria orientativa (80% a 30 años al 2.8% interés)
  const hipoteca = Math.round((unit.precio * 0.8) * 0.0041);

  container.innerHTML = `
    <div class="unit-view">
      <div class="unit-title">
        <div>
          <span class="unit-badge badge-${unit.estado}">● ${unit.estado}</span>
          <h3 style="margin-top:6px">${unit.nombre}</h3>
        </div>
        <div class="unit-price">${formattedPrice}</div>
      </div>

      <div class="specs-grid">
        <div class="spec-box">
          <div class="spec-label">Parcela</div>
          <div class="spec-val">${unit.sup_parcela} m²</div>
        </div>
        <div class="spec-box">
          <div class="spec-label">Construidos</div>
          <div class="spec-val">${unit.sup_construida} m²</div>
        </div>
        <div class="spec-box">
          <div class="spec-label">Dormitorios</div>
          <div class="spec-val">${unit.dormitorios} hab.</div>
        </div>
        <div class="spec-box">
          <div class="spec-label">Baños</div>
          <div class="spec-val">${unit.banos} (2+1)</div>
        </div>
      </div>

      <div class="model-info">
        <h4>${unit.tipologia} · 2 Plantas</h4>
        <p>Vivienda unifamiliar con amplio jardín privado, porche cubierto, calificación energética A, climatización por aerotermia y suelo radiante.</p>
        <div style="margin-top:8px;font-size:11px;color:var(--ink-3)">Orientación principal: <b>${unit.orientacion}</b></div>
      </div>

      <div class="calc-box">
        <div class="calc-title">
          <span>Cuota Hipoteca Estimada</span>
          <span style="color:var(--ink-3)">30 años · 80%</span>
        </div>
        <div class="calc-res">~${hipoteca} € / mes</div>
        <div style="font-size:10.5px;color:var(--ink-3);margin-top:4px">Cálculo orientativo sin vinculaciones.</div>
      </div>

      <div class="action-cta">
        <a href="https://www.mirapinos.com" target="_blank" class="btn-primary">Solicitar Información o Reserva</a>
        <button class="btn-secondary" onclick="alert('Descarga de plano de ' + '${unit.nombre}' + ' disponible próximamente.')">📄 Descargar Ficha y Plano PDF</button>
      </div>
    </div>
  `;
}

function setupEvents() {
  window.addEventListener('resize', () => {
    const stage = document.querySelector('.stage');
    camera.aspect = stage.clientWidth / stage.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(stage.clientWidth, stage.clientHeight);
  });

  // Filtros
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;

      unitMeshes.forEach(mesh => {
        const u = mesh.userData;
        let visible = true;
        if (filter === 'LIBRE' && u.estado !== 'LIBRE') visible = false;
        if (filter === 'Olivo' && !u.tipologia.includes('Olivo')) visible = false;
        if (filter === 'Arce' && !u.tipologia.includes('Arce')) visible = false;
        mesh.visible = visible;
        const tag = document.getElementById(`tag-${u.id}`);
        if (tag) tag.style.display = visible ? 'block' : 'none';
      });
    };
  });

  document.getElementById('btn-reset-cam').onclick = () => {
    controls.target.set(0, 0, 0);
    camera.position.set(0, 110, 150);
  };

  // Raycaster para clic 3D
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const canvas = document.getElementById('gl');

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    for (let hit of intersects) {
      let cur = hit.object;
      while (cur && cur.parent && !cur.userData.id) cur = cur.parent;
      if (cur && cur.userData && cur.userData.id) {
        selectUnit(cur.userData);
        break;
      }
    }
  });
}

function projectTags() {
  const stage = document.querySelector('.stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const tempV = new THREE.Vector3();

  D.units.forEach(unit => {
    const tag = document.getElementById(`tag-${unit.id}`);
    if (!tag || tag.style.display === 'none') return;

    tempV.set(unit.x, 7.5, -unit.y);
    tempV.project(camera);

    // Comprobar si está detrás de la cámara
    if (tempV.z > 1) {
      tag.style.opacity = '0';
      return;
    }

    const x = (tempV.x * 0.5 + 0.5) * w;
    const y = (-tempV.y * 0.5 + 0.5) * h;

    tag.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;
    tag.style.opacity = '1';
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  projectTags();
  renderer.render(scene, camera);
}

window.addEventListener('DOMContentLoaded', init);
